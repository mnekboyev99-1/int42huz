name: int42h-dev

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: int42h-db-dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=int42h
      - POSTGRES_PASSWORD=int42h
      - POSTGRES_DB=int42h
    ports:
      - "5432:5432"
    volumes:
      - int42h_db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U int42h"]
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis:8.6.1-alpine
    container_name: int42h-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - int42h_redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 4s
      retries: 5

volumes:
  int42h_db_dev_data:
  int42h_redis_dev_data:
